{% extends "base.html" %}

{% block content %}
  {{ super() }}

  <!-- 왼쪽 아래 Luau 버튼 -->
  <button id="luau-btn" class="luau-launcher-btn" type="button" title="Luau 코드 테스트" aria-label="Luau 코드 테스트 열기" aria-expanded="false">
      <img src="https://raw.githubusercontent.com/luau-lang/site/master/logo.svg" alt="Luau">
  </button>

  <div id="luau-container" class="luau-launcher-container">
      <!-- 오른쪽 위 조절 핸들 -->
      <div id="luau-resizer" class="resizer-top-right" title="드래그해서 크기 조절"></div>

      <div class="luau-launcher-header">
          <span>Luau 코드 테스트</span>
          <button id="luau-close" type="button" title="닫기 (Esc)" aria-label="닫기">✕</button>
      </div>

      <div id="luau-frame-wrap" class="luau-launcher-body"></div>
  </div>
{% endblock %}
